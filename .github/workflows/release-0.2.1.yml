name: Release 0.2.1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mashing-pedals-release-0.2.1
  cancel-in-progress: false
jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check immutable release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.2.1"; asset="Mashing-Pedals-0.2.1.apk"; response="$(mktemp)"
          status="$(curl -sS -o "$response" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GH_REPO/releases/tags/$tag")"
          if [[ "$status" == "404" ]]; then echo "release_exists=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$status" != "200" ]]; then cat "$response"; exit 1; fi
          if jq -e --arg asset "$asset" '.assets | any(.name == $asset)' "$response" >/dev/null; then echo "release_exists=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "Existing release incomplete; refusing to overwrite." >&2; exit 1
      - if: steps.existing.outputs.release_exists != 'true'
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - if: steps.existing.outputs.release_exists != 'true'
        uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools' }
      - if: steps.existing.outputs.release_exists != 'true'
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - if: steps.existing.outputs.release_exists != 'true'
        name: Test
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest
      - if: steps.existing.outputs.release_exists != 'true'
        name: Assemble APK
        run: ./gradlew --no-daemon assembleDebug
      - if: steps.existing.outputs.release_exists != 'true'
        name: Prepare release notes
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Mashing-Pedals-0.2.1.apk
          cat > release-notes.md <<'EOF'
          # Mashing Pedals 0.2.1
          - GPS speed/distance and speed-gated active time.
          - Configurable Speed, Trip, Heart Rate, and Cadence sections and individual metrics.
          - Save Trip / Delete Trip / Cancel, SQLite trip history, persistent global totals.
          - Dismissible source warning and scan for standard BLE heart-rate service.
          - Settings Save/Cancel, hue color wheel plus editable accent hex/preset colors, light-theme and compact-display options.
          - Restores typed command testing from the Ride module and keeps accessible colored module icons.
          CI debug-signed APK for direct device testing; not production/Play Store signed. If signature mismatch prevents updating, uninstall prior test build first (clears app data).
          Device testing still required for GPS behavior and whether Gear S3 exposes standard BLE Heart Rate Service. Cadence remains unavailable until a source is added.
          EOF
      - if: steps.existing.outputs.release_exists != 'true'
        name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create v0.2.1 release/Mashing-Pedals-0.2.1.apk --repo "$GH_REPO" --title "Mashing Pedals 0.2.1" --notes-file release-notes.md